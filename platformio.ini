; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
extra_configs = secrets.ini

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115250

board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

build_flags = 
    ; turn on serial for deubbing
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; see: https://gcc.gnu.org/gcc-14/porting_to.html#incompatible-pointer-types
    -Wno-error=incompatible-pointer-types
    ; see: https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-guides/build-system.html#component-requirements
    -I $PROJECT_DIR/managed_components/sepfy__libpeer/include
    -l sepfy__libpeer
    -l sepfy__srtp

    ${secrets.build_flags}

lib_deps =
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.3.0

custom_component_add = sepfy/libpeer

lib_extra_dirs = 
    .pio/libdeps/esp32dev/esp-webrtc-solution/components
